name: Production Deployment - SAID Bau Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone latest code
        run: |
          git clone --depth 1 https://github.com/eybes001/SAID-Bau-Website.git /tmp/repo
          echo "✓ Repository cloned successfully"

      - name: Prepare deployment
        run: |
          cd /tmp/repo
          echo "📦 Deployment Package Ready:"
          echo "  • HTML files: $(find . -maxdepth 1 -name '*.html' | wc -l)"
          echo "  • Total size: $(du -sh . | cut -f1)"

      - name: Install FTP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "✓ FTP tools ready"

      - name: Deploy to Hostinger
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          
          # Clean hostname
          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST%/}"
          
          echo "════════════════════════════════════════"
          echo "🚀 SAID Bau - Production Deployment"
          echo "════════════════════════════════════════"
          echo "Server: $FTP_HOST"
          echo "Target: /public_html/"
          echo "════════════════════════════════════════"
          
          # Deploy with retry logic
          deploy_attempt() {
            lftp -c "
              set ftp:ssl-allow no
              set net:max-retries 10
              set net:timeout 120
              set ftp:passive-mode on
              open -u $FTP_USER,$FTP_PASS $FTP_HOST
              cd /public_html
              lcd /tmp/repo
              mirror -Rv --exclude-glob .git* --exclude-glob .github* ./ ./
              bye
            "
            return $?
          }
          
          # Try deployment
          if deploy_attempt; then
            echo ""
            echo "✅ DEPLOYMENT SUCCESSFUL"
            exit 0
          else
            echo "⚠️  First attempt failed, retrying..."
            sleep 10
            if deploy_attempt; then
              echo ""
              echo "✅ DEPLOYMENT SUCCESSFUL (Retry)"
              exit 0
            else
              echo "❌ DEPLOYMENT FAILED"
              exit 1
            fi
          fi

      - name: Deployment complete
        if: success()
        run: |
          echo ""
          echo "╔════════════════════════════════════════╗"
          echo "║ ✅ DEPLOYMENT COMPLETED SUCCESSFULLY ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "📊 Details:"
          echo "  Website: https://saidbau.com"
          echo "  Deployed: $(date)"
          echo ""
          echo "🔍 Next:"
          echo "  1. Visit https://saidbau.com"
          echo "  2. Verify all pages load"
          echo "  3. Check contact email: info@saidbau.com"
          echo ""
          echo "📝 Update website: git push origin main"
          echo ""


      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          exit 1
