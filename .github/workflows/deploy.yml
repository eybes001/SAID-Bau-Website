name: Deploy to WordPress Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone repository
        run: |
          git clone --depth 1 https://github.com/eybes001/SAID-Bau-Website.git /tmp/repo
          cd /tmp/repo

      - name: Set up FTP deployment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp curl
          echo "✓ FTP tools installed successfully"

      - name: Deploy files to server
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          
          echo "🚀 Starting FTP deployment..."
          
          # Validate FTP credentials exist
          if [ -z "$FTP_HOST" ]; then
            echo "❌ ERROR: FTP_SERVER secret is not set or empty"
            exit 1
          fi
          if [ -z "$FTP_USER" ]; then
            echo "❌ ERROR: FTP_USERNAME secret is not set or empty"
            exit 1
          fi
          if [ -z "$FTP_PASS" ]; then
            echo "❌ ERROR: FTP_PASSWORD secret is not set or empty"
            exit 1
          fi
          
          # Clean FTP host (remove common prefixes if present)
          FTP_HOST="${FTP_HOST#ftp://}"
          FTP_HOST="${FTP_HOST#sftp://}"
          FTP_HOST="${FTP_HOST%/}"
          
          echo "📍 Target: $FTP_HOST"
          echo "👤 User: $FTP_USER"
          
          # Create FTP deployment script
          cat > /tmp/deploy.lftp << 'LFTP_EOF'
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:timeout 30
          set ftp:passive-mode on
          
          open -u $FTP_USER,$FTP_PASS $FTP_HOST
          lcd /tmp/repo
          cd /public_html
          mirror -eRvL --exclude-glob .git* --exclude-glob .github* --exclude-glob node_modules* ./ ./
          quit
          LFTP_EOF
          
          # Execute FTP deployment
          if lftp -f /tmp/deploy.lftp; then
            echo "✅ FTP connection successful"
          else
            echo "❌ FTP deployment failed"
            echo "Troubleshooting steps:"
            echo "1. Verify FTP_SERVER is correct (should be hostname or IP, no ftp:// prefix)"
            echo "2. Verify FTP_USERNAME is correct"
            echo "3. Verify FTP_PASSWORD is correct"
            echo "4. Ensure FTP/SFTP is enabled on your hosting account"
            exit 1
          fi
          
          echo "✅ Deployment completed successfully"

      - name: Verify deployment
        run: |
          echo "📦 Deployment Summary:"
          echo "  - Repository: SAID-Bau-Website"
          echo "  - Branch: main"
          echo "  - Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "✓ Files have been deployed to your WordPress site"

      - name: Deployment notification
        if: success()
        run: echo "🎉 Deployment successful! Your site should update within 5 minutes."

      - name: Deployment failed
        if: failure()
        run: |
          echo "❌ Deployment failed. Check the logs above for details."
          exit 1
